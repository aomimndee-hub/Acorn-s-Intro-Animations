<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intro Cutscene</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #gate {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 50%, rgba(140,120,255,0.18), #000 60%);
        color: #e9e6ff; font: 500 22px "Cormorant Garamond", Georgia, serif; letter-spacing: 0.12em;
        cursor: pointer; transition: opacity 0.4s;
      }
      #gate[hidden] { display: none; }
      #gate .orb {
        width: 70px; height: 70px; margin: 0 auto 18px; border-radius: 50%;
        border: 1px solid rgba(220,215,255,0.6);
        box-shadow: 0 0 40px rgba(170,150,255,0.7), inset 0 0 25px rgba(200,190,255,0.5);
        display: grid; place-items: center; font-size: 22px;
        animation: breathe 2.4s ease-in-out infinite;
      }
      #gate .wait { opacity: 0.6; font-size: 15px; }
      @keyframes breathe { 50% { transform: scale(1.08); box-shadow: 0 0 60px rgba(190,170,255,0.9), inset 0 0 25px rgba(200,190,255,0.6); } }
      #skip {
        position: fixed; right: 18px; bottom: 16px; z-index: 2;
        background: rgba(0,0,0,0.35); color: #fff; border: 1px solid rgba(255,255,255,0.25);
        border-radius: 999px; padding: 6px 14px; font: 500 13px system-ui, sans-serif;
        opacity: 0.25; cursor: pointer; transition: opacity 0.2s;
      }
      #skip:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="gate"><div><div class="orb">▶</div><div id="gateText" class="wait">loading…</div></div></div>
    <button id="skip" title="Skip (Esc)">Skip ›</button>
    <script type="module" src="/src/intro.js"></script>
  </body>
</html>
