<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intro Cutscene</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/popover.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <h1>Intro Cutscene</h1>
        <p class="sub">Select a token, then play it for the table.</p>
      </header>

      <section id="gm" hidden>
        <label class="field">
          <span>Animation</span>
          <select id="animation"></select>
          <small id="animDesc"></small>
        </label>

        <div id="crystalFields" class="stack">
          <div class="preview" id="preview">
            <div class="ring"></div>
            <img id="previewImg" alt="" />
            <span id="previewEmpty">No token selected</span>
          </div>

          <label class="field">
            <span>Name</span>
            <input id="name" type="text" maxlength="40" placeholder="Token name" />
          </label>
          <label class="field" id="subtitleField">
            <span>Subtitle <em>(optional)</em></span>
            <input id="subtitle" type="text" maxlength="60" placeholder="e.g. The Last Fragment" />
          </label>
          <label class="field" id="titleField" hidden>
            <span>Title card</span>
            <input id="title" type="text" maxlength="24" placeholder="ANCHOR" />
          </label>
          <div id="forsakenFields" class="stack" hidden>
            <label class="field">
              <span>Player's role</span>
              <select id="forsakenRole">
                <option value="infected">The infected one (in Rochas's place)</option>
                <option value="called">The one Nosoi calls at the end</option>
              </select>
            </label>
            <label class="field">
              <span>Show the player as</span>
              <select id="forsakenDisplay">
                <option value="character">A Roblox character (with name tag)</option>
                <option value="token">The token image</option>
              </select>
            </label>
          </div>
          <label class="check">
            <input id="reveal" type="checkbox" />
            <span>Make the token visible on the map when the intro ends</span>
          </label>
        </div>

        <div id="assaultFields" class="stack" hidden>
          <div class="team-label">Player team <em>(1–4)</em></div>
          <div id="teamGrid" class="team-grid"></div>
          <div class="team-label">Enemy target</div>
          <div id="targetSlot"></div>
          <label class="field">
            <span>Ending text</span>
            <input id="caption" type="text" maxlength="28" placeholder="CURTAIN CALL" />
          </label>
          <label class="field color">
            <span>Main color</span>
            <input id="accent" type="color" />
          </label>
        </div>

        <button id="play" class="primary" disabled>▶ Play for everyone</button>
        <button id="preview-btn" class="ghost" disabled>Preview only for me</button>
        <p class="hint" id="hint"></p>
      </section>

      <section id="player" hidden>
        <p class="note">Only the GM can start an intro. Sit back — it will open for you automatically.</p>
      </section>

      <label class="field volume">
        <span>Your volume <output id="volOut"></output></span>
        <input id="volume" type="range" min="0" max="1" step="0.05" />
      </label>
    </main>
    <script type="module" src="/src/popover.js"></script>
  </body>
</html>
